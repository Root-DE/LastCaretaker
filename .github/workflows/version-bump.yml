name: Version Bump

on:
  push:
    branches: [main]
    paths-ignore:
      - 'version.json'

permissions:
  contents: write

jobs:
  bump:
    name: Bump build number
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump version.json build number
        run: |
          BUILD=$(jq '.build' version.json)
          NEW_BUILD=$((BUILD + 1))
          jq --arg b "$NEW_BUILD" '.build = ($b | tonumber)' version.json > tmp.json && mv tmp.json version.json
          echo "Build bumped to $NEW_BUILD"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: bump build to $(jq '.build' version.json) [skip ci]"
          git push
