name: CI — Tests & Security

# Runs the full test suite (plus lint/security) on every pull request and on
# every push to the deploy branch. GitHub Pages serves from `master`, so gating
# merges on this workflow (via branch protection → required status check) ensures
# all tests pass before anything is deployed.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Only the latest run per ref matters as the gate; cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build & verify WASM kernel matches source
        run: |
          npm ci
          npm run build:wasm
          # Fail if the committed solver-kernel.wasm drifted from wasm/solver-kernel.wat.
          git diff --exit-code -- solver-kernel.wasm \
            || (echo "::error::solver-kernel.wasm is out of date. Run 'npm run build:wasm' and commit the result." && exit 1)

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run tests in browser
        run: |
          # Pre-install the static server so startup isn't racing an npm download.
          npm install --no-save serve@14
          # Start it in the background.
          npx serve . -l 8080 &
          # Wait until it actually accepts connections (up to ~30s) before testing.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/tests.html -o /dev/null; then
              echo "Server is up."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Server did not start within 30s."
              exit 1
            fi
            sleep 1
          done
          # Run the test page and check results.
          node run-tests.js

  security:
    name: Security scan
    runs-on: ubuntu-latest
    # Pull requests only. `master` is protected and accepts changes exclusively
    # through a PR, so a push here is always a merge of a diff this job has
    # already linted — and repeating it is not free. super-linter resolves the
    # diff base from the push event's "before" commit, which a force-push leaves
    # unreachable; it then falls back to HEAD~20, and that walks the first-parent
    # chain, which is far shorter than 20 here because most commits arrive behind
    # merge commits. The job then dies during initialization without linting
    # anything. Running on the PR drops the failure mode and loses no coverage.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # super-linter needs full history to diff the changed files against the base.
          fetch-depth: 0

      - name: Run super-linter
        uses: github/super-linter/slim@v7
        env:
          # Lint only the files changed in this PR, not the entire legacy
          # codebase. Full-codebase linting was never enforced here and would fail
          # on pre-existing style; scoping to the diff is super-linter's
          # recommended adoption mode and keeps new changes clean. Rules come from
          # .github/linters/, which is where this project's own conventions live.
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_CSS: true
          VALIDATE_HTML: true
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LEVEL: WARN

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
