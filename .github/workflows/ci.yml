name: CI — Tests & Security

# Runs the full test suite (plus lint/security) on every pull request and on
# every push to the deploy branch. GitHub Pages serves from `master`, so gating
# merges on this workflow (via branch protection → required status check) ensures
# all tests pass before anything is deployed.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Only the latest run per ref matters as the gate; cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build & verify WASM kernel matches source
        run: |
          npm ci
          npm run build:wasm
          # Fail if the committed solver-kernel.wasm drifted from wasm/solver-kernel.wat.
          git diff --exit-code -- solver-kernel.wasm \
            || (echo "::error::solver-kernel.wasm is out of date. Run 'npm run build:wasm' and commit the result." && exit 1)

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run tests in browser
        run: |
          # Start a simple HTTP server
          npx serve . -l 8080 &
          sleep 2
          # Run the test page and check results
          node run-tests.js

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # super-linter needs full history to diff the changed files against the base.
          fetch-depth: 0

      - name: Run CodeQL-like static analysis
        uses: github/super-linter/slim@v7
        env:
          # Lint only the files changed in this PR/push, not the entire legacy
          # codebase. Full-codebase linting was never enforced here and would fail
          # on pre-existing style; scoping to the diff is super-linter's
          # recommended adoption mode and keeps new changes clean.
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_CSS: true
          VALIDATE_HTML: true
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LEVEL: WARN

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
